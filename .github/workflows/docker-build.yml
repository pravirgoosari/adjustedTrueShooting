name: Build and Push Docker Image

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "0 10 * * 1"

permissions:
  contents: read
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Generate season data
        run: |
          pip install -r requirements-data.txt -r requirements-runtime.txt
          python -m scripts.generate_data

      - name: Test application
        run: python -m unittest discover -v

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            pravirgoosari/adjusted-true-shooting:latest
            pravirgoosari/adjusted-true-shooting:${{ github.sha }}
            pravirgoosari/adjusted-true-shooting:run-${{ github.run_id }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Log in to Azure
        if: github.event_name != 'pull_request'
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy Docker Hub image to Azure Container Apps
        if: github.event_name != 'pull_request'
        run: |
          az containerapp update \
            --name adjusted-true-shooting \
            --resource-group adjusted-true-shooting-rg \
            --image docker.io/pravirgoosari/adjusted-true-shooting:run-${{ github.run_id }}
